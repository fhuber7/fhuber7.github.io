<style>
  /* Global sidebar styling: consistent across all pages */
  .sidebar,
  .sidebar.sticky {
    background: transparent !important;
    background-color: transparent !important;
    border: none !important;
    box-shadow: none !important;
    overflow: visible !important;
    max-height: none !important;
    height: auto !important;
    padding: 0 !important;
  }
  .sidebar .author__avatar,
  .sidebar .author__content,
  .sidebar .author__urls-wrapper,
  .sidebar .author__urls {
    background: transparent !important;
    background-color: transparent !important;
    border: none !important;
    box-shadow: none !important;
  }
  .author__urls.social-icons li {
    background: transparent !important;
  }

  /* Circular avatar. profile-avatar.jpg is a square crop of profile.jpg
     centred on the face, so the image needs no position offset. */
  .sidebar .author__avatar img {
    object-fit: cover !important;
    aspect-ratio: 1 / 1 !important;
    width: 110px !important;
    height: 110px !important;
    max-width: 110px !important;
  }

  /* Top bar in the PLUS corporate green (--plus-ci-green on plus.ac.at) */
  .masthead {
    background: #115740;
    border-bottom: none;
  }
  .masthead .greedy-nav {
    background: #115740;
  }
  .masthead .greedy-nav a {
    color: #fff;
  }
  .masthead .greedy-nav a:hover {
    color: #d7e7df;
  }
  .masthead .greedy-nav .visible-links a:before {
    background: #fff;
  }
  .masthead .navicon,
  .masthead .navicon:before,
  .masthead .navicon:after {
    background: #fff;
  }
  .masthead .greedy-nav__toggle:hover .navicon,
  .masthead .greedy-nav__toggle:hover .navicon:before,
  .masthead .greedy-nav__toggle:hover .navicon:after {
    background: #d7e7df;
  }
  .masthead .greedy-nav__toggle.close .navicon {
    background: transparent;
  }
  /* the overflow menu keeps its white panel, so its links stay green */
  .masthead .greedy-nav .hidden-links a {
    color: #115740;
  }
  .masthead .greedy-nav .hidden-links a:hover {
    color: #fff;
    background: #115740;
  }
  /* university seal (site.logo) left of the title, a bit larger than the theme's 2rem */
  .masthead .site-logo img {
    max-height: 2.5rem;
  }
</style>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    var links = document.querySelectorAll('.sidebar .author__urls a');
    links.forEach(function (a) {
      var href = a.getAttribute('href') || '';
      if (href && href.indexOf('mailto:') !== 0 && href.charAt(0) !== '#') {
        a.setAttribute('target', '_blank');
        a.setAttribute('rel', 'noopener noreferrer');
      }
    });
  });
</script>
