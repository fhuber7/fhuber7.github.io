<style>
  /* Global sidebar styling: consistent across all pages */
  .sidebar,
  .sidebar.sticky {
    background: transparent !important;
    background-color: transparent !important;
    border: none !important;
    box-shadow: none !important;
    overflow: visible !important;
    max-height: none !important;
    height: auto !important;
    padding: 0 !important;
  }
  .sidebar .author__avatar,
  .sidebar .author__content,
  .sidebar .author__urls-wrapper,
  .sidebar .author__urls {
    background: transparent !important;
    background-color: transparent !important;
    border: none !important;
    box-shadow: none !important;
  }
  .author__urls.social-icons li {
    background: transparent !important;
  }

  /* Circular avatar. profile-avatar.jpg is a square crop of profile.jpg
     centred on the face, so the image needs no position offset. */
  .sidebar .author__avatar img {
    object-fit: cover !important;
    aspect-ratio: 1 / 1 !important;
    width: 110px !important;
    height: 110px !important;
    max-width: 110px !important;
  }

  /* Top bar in light grey (the footer's colour) with the body text colour */
  .masthead,
  .masthead .greedy-nav {
    background: #f2f3f3;
  }
  .masthead .greedy-nav a {
    color: #3d4144;
  }
  .masthead .greedy-nav a:hover {
    color: #000;
  }
</style>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    var links = document.querySelectorAll('.sidebar .author__urls a');
    links.forEach(function (a) {
      var href = a.getAttribute('href') || '';
      if (href && href.indexOf('mailto:') !== 0 && href.charAt(0) !== '#') {
        a.setAttribute('target', '_blank');
        a.setAttribute('rel', 'noopener noreferrer');
      }
    });
  });
</script>
